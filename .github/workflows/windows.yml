name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configurar .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Testar e gerar pacote portátil
        shell: pwsh
        run: ./build.ps1
      - name: Disponibilizar aplicativo
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assinador-windows-win-x64
          path: |
            artifacts/assinador-windows-*-win-x64.zip
            artifacts/assinador-windows-*-win-x64.zip.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Disponibilizar relatórios de testes
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-relatorios
          path: artifacts/test-results/
          if-no-files-found: ignore
          retention-days: 14
